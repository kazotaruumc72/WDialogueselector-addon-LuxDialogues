    description: 'Check quest progress with quest giver'
    enabled: true

  dialogue_quest_complete:
    target: 'fancynpcs:QuestGiver'
    luxdialogues-id: 'quest_completion'
    description: 'Complete quest and receive rewards'
    enabled: true

  # Shop and trading dialogues
